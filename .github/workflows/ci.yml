name: SOP fixtures
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - name: Regression suites
        run: |
          for suite in docs/benchmark/*-fixtures/run-tests.sh; do
            bash "$suite" || exit 1
          done
      - name: Shell lint
        shell: bash
        run: |
          [ -n "$(git ls-files '*.sh')" ] || { echo 'no tracked .sh files to lint'; exit 1; }
          git ls-files -z '*.sh' | xargs -0 shellcheck -S warning
